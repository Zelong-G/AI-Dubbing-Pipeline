[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dubbing-pipeline"
version = "0.1.0"
description = "Modular text-to-speech and temporally aligned local-video dubbing research pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
config = ["PyYAML>=6.0"]
dev = ["pytest>=7.0", "ruff>=0.6"]
ocr = ["rapidocr>=3.9,<4"]
xtts = ["TTS>=0.22"]
chatterbox = ["chatterbox-tts>=0.1.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
