[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dubbing-pipeline"
version = "0.1.0"
description = "Modular translation, speech, and temporal-alignment pipeline for audiobooks and local-video dubbing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Zelong Zheng"},
]
keywords = [
  "multimodal-ai",
  "speech-synthesis",
  "video-dubbing",
  "subtitle-processing",
  "temporal-alignment",
  "llm",
  "tts",
  "ffmpeg",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
config = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]
ocr = ["rapidocr>=3.9,<4"]

[project.urls]
Repository = "https://github.com/Zelong-G/AI-Dubbing-Pipeline"
Documentation = "https://github.com/Zelong-G/AI-Dubbing-Pipeline/tree/main/docs"

[tool.setuptools.packages.find]
include = ["ai_dubbing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
